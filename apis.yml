aid: bithtv
name: bith.tv
description: >-
  Bith.ai (bith.tv) is an all-in-one, AI-powered video editing and content
  creation platform for creators, letting users record, edit, resize, caption,
  and publish short-form video reformatted for the major social platforms from a
  single browser-based dashboard. Founded in 2019 and headquartered in Amman,
  Jordan, the company is backed by 500 Global, BeyondCapital, Propeller, and
  Oasis500. Bith does not currently expose a public developer API, SDKs, or
  documentation surface; this profile was added to the API Evangelist network as
  a 500 Global portfolio lead and enriched with what the company publicly
  publishes (website, marketing tool pages, pricing, sign-up, and probed domain
  security posture).
